[tool.ruff]
# The scripts are already ruff-formatted at the default 88 -- the few longer
# lines are strings and comments the formatter cannot split. Stated rather than
# left implicit so a future change to ruff's own default cannot silently reflow
# the whole codebase.
line-length = 88

[tool.ruff.lint]
# Pinned deliberately. Leaving `select` unset means inheriting ruff's default,
# which is not a stable contract: it has grown from roughly 50 rules to 413
# across releases, and the sets are not nested -- 0.16's default drops E741,
# which older ruff caught. With `ruff>=0.16` floating, an unpinned set lets an
# upgrade change what passes with no change to this code.
#
#   E, W  pycodestyle       F   pyflakes -- real bugs
#   I     import sorting    UP  pyupgrade, floored by `requires-python` above
#   B     bugbear           SIM, RUF  simplification and ruff's own rules
#   PLE   pylint errors     PLW pylint warnings
#
# Deliberately out:
#   PLR  pylint refactor heuristics (too-many-branches and friends) -- 17 hits
#        here, all judgements about code that reads fine.
#   S    bandit -- 467 hits, 463 of them S101 `assert`, which is what the test
#        suite is built from.
#   DTZ  naive datetimes. `reindex.py` ages tasks off `date.today()` in local
#        time on purpose; the vault has no timezone story to get wrong.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PLE", "PLW"]

# Line length is the formatter's decision. Letting the linter re-police it only
# re-reports the long strings and comments `ruff format` chose to leave alone.
ignore = ["E501"]

[tool.ruff.format]
# ruff also formats Python fenced in Markdown. The dated specs and plans under
# `docs/` are records of what was true when they were written, so their code
# blocks stay as written rather than being reflowed to the current style.
exclude = ["docs/**"]

[tool.ty.environment]
# The scripts are flat modules, not a package -- `reindex.py` does `import
# vaultlib`. ty infers this from each file's own directory, but stating it keeps
# the CLI and the language server resolving imports the same way.
root = [".stunning-octo-journey/scripts"]

# Matches `requires-python` above. ty uses this to decide which stdlib symbols
# exist, the same way ruff's UP rules do.
python-version = "3.12"

[tool.ty.terminal]
# A warning that nobody is forced to look at is a warning that accumulates.
error-on-warning = true
