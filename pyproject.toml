[project]
name = "backend"
version = "0.1.0"
description = "Self-hosted spreadsheet-database web app"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja",
    "psycopg[binary]>=3.2",
    "argon2-cffi",
    "django-otp",
    "django-axes",
    "cryptography",
    "uvicorn",
    "whitenoise",
]

[dependency-groups]
dev = ["pytest", "pytest-django", "time-machine", "ruff", "ty"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
# The backend is ruff-formatted at the default 88 -- the few longer lines are
# strings and comments the formatter cannot split. Stated rather than
# left implicit so a future change to ruff's own default cannot silently reflow
# the whole codebase.
line-length = 88

[tool.ruff.lint]
# Pinned deliberately. Leaving `select` unset means inheriting ruff's default,
# which is not a stable contract: it has grown from roughly 50 rules to 413
# across releases, and the sets are not nested -- 0.16's default drops E741,
# which older ruff caught. With `ruff>=0.16` floating, an unpinned set lets an
# upgrade change what passes with no change to this code.
#
#   E, W  pycodestyle       F   pyflakes -- real bugs
#   I     import sorting    UP  pyupgrade, floored by `requires-python` above
#   B     bugbear           SIM, RUF  simplification and ruff's own rules
#   PLE   pylint errors     PLW pylint warnings
#
# Deliberately out:
#   PLR  pylint refactor heuristics (too-many-branches and friends) -- they
#        are judgements about code that usually reads fine.
#   S    bandit -- nearly all hits would be S101 `assert`, which is what the
#        test suite is built from.
#   DTZ  naive datetimes. Django runs with USE_TZ and aware datetimes, so the
#        rule adds little beyond what the framework already enforces.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PLE", "PLW"]

# Line length is the formatter's decision. Letting the linter re-police it only
# re-reports the long strings and comments `ruff format` chose to leave alone.
ignore = ["E501"]

[tool.ruff.format]
# ruff also formats Python fenced in Markdown. The dated specs and plans under
# `docs/` are records of what was true when they were written, so their code
# blocks stay as written rather than being reflowed to the current style.
exclude = ["docs/**"]

[tool.ty.environment]
# Backend modules import each other as top-level packages (`import config`,
# `from api.errors import ApiError`), so `backend/` is the import root. Stating
# it keeps the CLI and the language server resolving imports the same way.
root = ["backend"]

# Matches `requires-python` above. ty uses this to decide which stdlib symbols
# exist, the same way ruff's UP rules do.
python-version = "3.12"

[tool.ty.terminal]
# A warning that nobody is forced to look at is a warning that accumulates.
error-on-warning = true
